    require_problem_statement: true
  spec:
    require_acceptance_criteria: true
  design:
    require_tradeoffs: true
  tasks:
    protect_review_workload: true
  apply:
    test_command: "bun run test"
  verify:
    test_command: "bun run test"
testing:
  detected: "2026-08-28"
  runner:
    command: "bun run test"
    framework: "Vitest"
  layers:
    unit: "Vitest, package script, Vitest"
    integration: ""
    e2e: ""
  commands:
    unit:
      - scope: "."
        command: "bun run test"
        framework: "Vitest"
      - scope: "apps/dashboard"
        command: "cd apps/dashboard && npm test"
        framework: "package script"
      - scope: "apps/gateway"
        command: "cd apps/gateway && npm run vitest"
        framework: "Vitest"
    integration:
      []
    e2e:
      []
  coverage:
    command: ""
    commands:
      []
quality:
  lint: "bun run lint"
  lint_commands:
    - scope: "."
      command: "bun run lint"
      framework: "linter"
  typecheck: "bun run typecheck"
  typecheck_commands:
    - scope: "."
      command: "bun run typecheck"
      framework: "type checker"
    - scope: "apps/dashboard"
      command: "cd apps/dashboard && npm run typecheck"
      framework: "type checker"
  format: "bun run format"
  format_commands:
    - scope: "."
      command: "bun run format"
      framework: "formatter"
