name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default: workflow only needs to read the repo checkout.
permissions:
  contents: read

# The jobs split `bun run check` to run side by side; together they run every step of it
# (apps/gateway/tests/ci-check.test.ts), so a local run and CI cannot differ.
jobs:
  static:
    name: lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run lint
      - run: bun run typecheck

  gateway:
    name: gateway tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run test
      - run: bun run test:workers:gateway

  mcp:
    name: mcp tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run test:workers:mcp

  dashboard:
    name: dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run check:dashboard

  sites:
    name: site & docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run check:site
      - run: bun run check:docs

  # The branch ruleset requires this check name: it passes only when every job above passed.
  test:
    name: typecheck & test
    if: always()
    needs: [static, gateway, mcp, dashboard, sites]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
