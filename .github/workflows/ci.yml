name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default: workflow only needs to read the repo checkout.
permissions:
  contents: read

# The jobs split `bun run check` to run side by side; together they run every step of it
# (apps/gateway/tests/ci-check.test.ts), so a local run and CI cannot differ.
jobs:
  static:
    name: lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # tsc --incremental state from the last run: tsc re-checks only what changed since.
      - uses: actions/cache@v4
        with:
          path: |
            *.tsbuildinfo
            apps/*/*.tsbuildinfo
            packages/*/*.tsbuildinfo
          key: tsc-${{ github.job }}-${{ github.sha }}
          restore-keys: tsc-${{ github.job }}-
      - run: bun run lint
      - run: bun run typecheck

  # The Workers suite split by recorded duration (apps/gateway/tests/shards.ts).
  gateway:
    name: gateway tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run test:workers:gateway --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  mcp:
    name: unit & mcp tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run test
      - run: bun run test:workers:mcp

  dashboard:
    name: dashboard types & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # tsc --incremental state from the last run: tsc re-checks only what changed since.
      - uses: actions/cache@v4
        with:
          path: |
            *.tsbuildinfo
            apps/*/*.tsbuildinfo
            packages/*/*.tsbuildinfo
          key: tsc-${{ github.job }}-${{ github.sha }}
          restore-keys: tsc-${{ github.job }}-
      - run: bun run typecheck:dashboard
      - run: bun run build:dashboard

  dashboard-tests:
    name: dashboard tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run test:dashboard

  sites:
    name: site & docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run check:site
      - run: bun run check:docs

  # The branch ruleset requires this check name: it passes only when every job above passed.
  test:
    name: typecheck & test
    if: always()
    needs: [static, gateway, mcp, dashboard, dashboard-tests, sites]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
