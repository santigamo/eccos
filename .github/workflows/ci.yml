name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default: workflow only needs to read the repo checkout.
permissions:
  contents: read

jobs:
  test:
    name: typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The whole gate is one script, so a local run and CI cannot differ:
      # lint, typecheck, both test suites, site, docs, dashboard.
      - name: Check
        run: bun run check
